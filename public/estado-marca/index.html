<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Ulpik · Estado de tu marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="search.css?v=20260923">
</head>
<body>
  <div class="page">
    <header class="hero">
      <img class="logo" src="logo.png" alt="Ulpik">
      <h1>Estado de tu marca</h1>
      <p>Consulta el avance de tu trámite. La búsqueda principal es por CI/RUC; también puedes usar tu código UPK.</p>
    </header>

    <section class="panel">
      <div class="modes" role="tablist">
        <button type="button" class="mode on" data-mode="dni" id="modeDni">CI / RUC</button>
        <button type="button" class="mode" data-mode="upk" id="modeUpk">Código UPK</button>
      </div>

      <form id="searchForm" class="form">
        <label id="fieldLabel" for="query">Número de CI o RUC</label>
        <div class="row">
          <input id="query" name="query" autocomplete="off" placeholder="Ej. 1712345678" required>
          <button type="submit" class="cta" id="btnSearch">Buscar</button>
        </div>
        <p class="hint" id="fieldHint">Ingresa el documento del titular. Si tienes varias marcas, las verás en tarjetas.</p>
      </form>

      <div id="status" class="status" hidden></div>
      <div id="cards" class="cards" hidden></div>
    </section>

    <footer class="foot">El detalle de cada marca se abre con su código UPK.</footer>
  </div>
  <script src="search.js?v=20260923c"></script>
</body>
</html>
